[project]
name = "mini-judge"
version = "0.1.0"
description = "A simple online judge system supporting Python and C/C++"
authors = [
    {name = "Shengyu Ye", email = "ysy007@mail.ustc.edu.cn"},
]
dependencies = [
    "fastapi",
    "uvicorn",
    "redis",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pytest-asyncio",
    "httpx",
    "rich",
    "psutil",
    "datasets",
    "huggingface_hub",
    "hf_transfer",
    "ratelimit",
    "typer",
]
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

base = [
    "beautifulsoup4",
    "fake-useragent",
    "imageio",
    "keras",
    "lxml",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "pillow",
    "requests",
    "rich",
    "scikit-learn",
    "sphinx-pyproject",
    "statsmodels",
    "sympy",
    "tweepy",
    "typing_extensions",
    "xgboost",
    "flask",
    "seaborn",
    "networkx",
]

all = ["mini-judge[base,dev]",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "C", "W"]
ignore = ["C901", "N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
